name: Construir extractos de POIs

on:
  # TRIMESTRAL, no mensual. El mundo entero son ~83 GB de .osm.pbf descargados de
  # Geofabrik, que es gratuito y lo mantienen voluntarios: mensual serian ~1 TB al ano
  # y seria abusar. Los POIs turisticos no cambian a ese ritmo -un templo lleva siglos
  # donde esta-, asi que un trimestre de desfase no le cuesta nada al viajero.
  schedule:
    - cron: '0 4 1 1,4,7,10 *'   # dia 1 de enero, abril, julio y octubre, 04:00 UTC
  workflow_dispatch:
    inputs:
      scope:
        description: 'Continentes o ids de region separados por espacios (vacio = el mundo). Ej: europe'
        required: false
        default: ''
      repair:
        description: 'Reparar: construir solo las regiones que falten en el Release vigente'
        type: boolean
        default: false
      catalog_only:
        description: 'Solo catalogo: rehacerlo desde los extractos ya publicados, sin construir nada'
        type: boolean
        default: false
      publish:
        description: 'Publicar el Release (desmarcar para una prueba que no toque el catalogo vivo)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-extracts
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Que hay que construir y en cuantos trozos
  # ---------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      empty: ${{ steps.plan.outputs.empty }}
      regions: ${{ steps.plan.outputs.regions }}
      shards: ${{ steps.plan.outputs.shards }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Assets del Release vigente
        # Hacen falta para el modo reparacion (que falta) y para heredar en el catalogo
        # las regiones que este build no reconstruye.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view --json assets --jq '.assets[].name' > present.txt 2>/dev/null; then
            echo "El Release vigente tiene $(grep -c '\.sqlite$' present.txt || true) extractos"
          else
            : > present.txt
            echo "No hay ningun Release publicado todavia"
          fi

      - name: Repartir la matriz
        id: plan
        env:
          SCOPE: ${{ inputs.scope }}
          REPAIR: ${{ inputs.repair }}
          CATALOG_ONLY: ${{ inputs.catalog_only }}
        run: |
          set -euo pipefail
          if [ "${CATALOG_ONLY:-false}" = "true" ]; then
            # El catalogo se rehace desde los extractos ya publicados: ni un .pbf se
            # descarga. Sirve para arreglar la geometria o los filtros del catalogo sin
            # volver a construir el mundo entero, que son horas y decenas de GB.
            echo "Solo catalogo: no se construye ninguna region"
            {
              echo "matrix=[]"
              echo "empty=true"
              echo "regions=0"
              echo "shards=0"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # SCOPE lo escribe quien lanza el workflow: llega por env y lo valida el
          # script, nunca interpolado en el shell (seria inyeccion de comandos).
          args=""
          if [ "${REPAIR:-false}" = "true" ]; then args="--repair"; fi
          python scripts/plan_build.py --regions regions.json \
            --scope "${SCOPE:-}" --present present.txt $args

      - name: Preparar el Release
        id: release
        if: steps.plan.outputs.empty != 'true' || inputs.catalog_only
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR: ${{ inputs.repair }}
          CATALOG_ONLY: ${{ inputs.catalog_only }}
        run: |
          set -euo pipefail
          # La huella del filtro NO se calcula aqui: sale de catalog.json en el job
          # final. Asi se publica la de los extractos que REALMENTE se construyeron y
          # no la que dice el codigo, que ademas obligaba a instalar pyosmium en este
          # job solo para calcular un hash.
          #
          # Reparar y rehacer el catalogo trabajan sobre el Release VIGENTE; una
          # construccion normal estrena uno.
          if [ "${REPAIR:-false}" = "true" ] || [ "${CATALOG_ONLY:-false}" = "true" ]; then
            # NO se crea un Release nuevo: se trabaja sobre el vigente, que es el que la
            # app esta consumiendo ahora mismo por /releases/latest/download/.
            tag=$(gh release view --json tagName --jq .tagName)
            echo "Sobre el Release vigente: $tag"
          else
            tag="data-$(date -u +%Y-%m-%d)"
            estado=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo ausente)
            if [ "$estado" = "true" ]; then
              echo "Se reaprovecha el borrador $tag (repeticion de un build que no llego a publicarse)"
            else
              if [ "$estado" != "ausente" ]; then
                # Ya publicado, y es el que la app esta sirviendo AHORA por
                # /releases/latest/download/. Una construccion completa dura horas: caer
                # encima dejaria ese Release mezclando lo viejo y lo nuevo todo ese rato.
                # Pasa en cuanto se lanzan dos builds completos el mismo dia, que es
                # justo lo que ocurre al validar con un continente y seguir con el mundo.
                n=2
                while gh release view "$tag.$n" >/dev/null 2>&1; do n=$((n + 1)); done
                echo "$tag ya esta publicado: se construye en $tag.$n"
                tag="$tag.$n"
              fi
              # Se crea como BORRADOR: mientras los shards suben sus .sqlite, el
              # Release esta a medias, y /releases/latest/download/ debe seguir
              # sirviendo el anterior, completo. Lo publica el job final.
              gh release create "$tag" --draft --title "Extractos de POIs $tag" --notes "En construccion..."
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Construir, repartido por peso
  # ---------------------------------------------------------------------------
  build:
    needs: plan
    if: needs.plan.outputs.empty != 'true'
    name: ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # Geofabrik es gratuito y lo mantienen voluntarios: 6 descargas en paralelo
      # aprovechan la matriz sin convertirla en una tromba contra su servidor.
      max-parallel: 6
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar pyosmium
        run: pip install --disable-pip-version-check osmium

      - name: Construir extractos
        env:
          IDS: ${{ matrix.shard.regions }}
          SHARD: ${{ matrix.shard.name }}
        run: |
          # Sin `-e` A PROPOSITO: una region que falla no puede tumbar el shard entero.
          # Geofabrik tiene incidencias -el 2026-07-30 su proxy devolvia 502 hasta para
          # un .md5 de 100 bytes-, y con `-e` un solo 502 tiraba tambien las 81 regiones
          # ya construidas del shard. Se apunta la fallida, se sigue, y el modo `repair`
          # las recoge despues.
          set -uo pipefail
          mkdir -p dist
          : > fallidas.txt
          echo "Shard $SHARD"
          for id in ${IDS:-}; do
            url=$(jq -r --arg id "$id" '.regions[] | select(.id==$id) | .source // empty' regions.json)
            if [ -z "$url" ]; then
              echo "::error::region desconocida en regions.json: $id"
              echo "$id" >> fallidas.txt
              continue
            fi
            echo "::group::$id"
            # Reintento con espera EXPONENCIAL (1s, 2s, 4s... ~4 min en total). Omitir
            # --retry-delay es lo que la activa: con un retardo fijo curl no la aplica.
            # Los 3 reintentos cada 5 s de antes se agotaban en 15 segundos, que no cubre
            # ni la mas breve de las incidencias de Geofabrik.
            if ! curl -fL --retry 8 --retry-max-time 1200 --retry-all-errors -o "$id.osm.pbf" "$url"; then
              echo "::warning::$id: Geofabrik no sirvio el .pbf"
              echo "$id" >> fallidas.txt
            # Un .pbf de verdad lleva "OSMHeader" en sus primeros bytes. Hay entradas del
            # indice de Geofabrik cuyo fichero ya no existe: en vez de un 404, REDIRIGEN a
            # su portada y sirven el HTML con un 200, asi que `curl -f` lo da por bueno y
            # se guarda una pagina web con extension .pbf (paso con `enfield`, 9.609 bytes
            # de HTML). Sin esta comprobacion el sintoma es un RuntimeError de osmium
            # sobre una cabecera invalida, que no dice nada de lo que pasa de verdad.
            elif ! head -c 64 "$id.osm.pbf" | grep -aq OSMHeader; then
              echo "::warning::$id: lo que sirve Geofabrik no es un .pbf ($(file -b "$id.osm.pbf"))"
              echo "$id" >> fallidas.txt
            elif ! python scripts/build_extract.py "$id.osm.pbf" "dist/$id.sqlite" --region "$id"; then
              echo "::warning::$id: fallo la construccion del extracto"
              echo "$id" >> fallidas.txt
              rm -f "dist/$id.sqlite"
            fi
            # Liberar disco antes de la siguiente: los runners traen ~14 GB libres y
            # un .pbf de pais grande se los come.
            rm -f "$id.osm.pbf"
            echo "::endgroup::"
          done
          df -h / | tail -1
          ls -lh dist/ || true

      - name: Metadatos de las regiones de este shard
        # El .sqlite sube directo al Release y de aqui solo sale este JSON minusculo.
        # Mover los GB dos veces (artefacto y descarga en el job final) costaria mas
        # tiempo que construirlos.
        if: hashFiles('dist/*.sqlite') != ''
        run: python scripts/build_catalog.py --regions regions.json --dist dist --emit-meta meta

      - name: Subir los extractos al Release
        if: hashFiles('dist/*.sqlite') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.sqlite --clobber

      - name: Guardar los metadatos
        if: hashFiles('dist/*.sqlite') != ''
        uses: actions/upload-artifact@v7
        with:
          name: meta-${{ matrix.shard.name }}
          path: meta/
          retention-days: 7

      - name: Regiones que no salieron
        # DESPUES de subir lo que si salio: el shard se marca en rojo para que se vea,
        # pero sin perder el trabajo bueno. `repair` reconstruye solo estas.
        if: always()
        run: |
          set -uo pipefail
          if [ -s fallidas.txt ]; then
            echo "::error::$(wc -l < fallidas.txt) regiones sin construir en este shard: $(tr '\n' ' ' < fallidas.txt)"
            echo "Relanza el workflow con **repair** marcado para reconstruir solo estas." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 3. Un solo catalogo con TODAS las regiones, y publicar
  # ---------------------------------------------------------------------------
  finalize:
    needs: [plan, build]
    # `always()` para que un shard caido no impida publicar lo que si salio: el
    # catalogo hereda del Release anterior las regiones que falten y el job de
    # reparacion las reconstruye despues.
    if: always() && inputs.publish != false && (needs.plan.outputs.empty != 'true' || inputs.catalog_only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Recoger los metadatos de todos los shards
        # v8 descarga solo artefactos subidos por upload-artifact v4 o superior, asi que
        # las dos suben juntas. Ambas corren ya en Node 24 (las v4 avisaban de que
        # apuntan a Node 20 y el runner las forzaba).
        if: needs.plan.outputs.empty != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: meta-*
          merge-multiple: true
          path: meta

      - name: Descargar los extractos ya publicados (solo catalogo)
        # La geometria del catalogo sale de `meta.cells` de cada .sqlite, asi que para
        # rehacerla hay que tener los ficheros delante. Son ~1,9 GB del CDN, minutos,
        # frente a las horas y los 83 GB de reconstruir el mundo desde Geofabrik.
        if: inputs.catalog_only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --pattern '*.sqlite' --dir dist
          echo "$(ls dist | wc -l) extractos, $(du -sh dist | cut -f1)"

      - name: Catalogo anterior (para heredar lo no reconstruido)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          # El catalogo NO se puede generar por shard: la app necesita todas las
          # regiones en uno. Y una region que este build no toco debe seguir en el
          # catalogo, con sus datos de antes.
          gh release download "$TAG" --pattern catalog.json --dir base 2>/dev/null \
            || gh release download --pattern catalog.json --dir base 2>/dev/null \
            || echo "sin catalogo previo"

      - name: Generar catalog.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Que hay REALMENTE en este Release. Los assets no viajan de un Release a
          # otro, asi que una region heredada cuyo .sqlite se quedo en el anterior no
          # puede figurar en el catalogo: la app pediria un fichero que da 404.
          gh release view "$TAG" --json assets --jq '.assets[].name' > assets.txt
          base=""
          if [ -f base/catalog.json ]; then base="--base base/catalog.json"; fi
          python scripts/build_catalog.py --regions regions.json --dist dist \
            --meta meta --assets assets.txt --out dist/catalog.json $base
          # La huella que se publica es la de los extractos construidos, leida del
          # catalogo ya generado. Queda disponible para los pasos siguientes.
          echo "FINGERPRINT=$(jq -r .filter_fingerprint dist/catalog.json)" >> "$GITHUB_ENV"
          echo "CATALOG_REGIONS=$(jq -r '.regions | length' dist/catalog.json)" >> "$GITHUB_ENV"

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/catalog.json --clobber
          notes="Extractos de POIs generados desde OpenStreetMap (Geofabrik).

          Construidos desde el commit \`${SHA:0:7}\`, huella del filtro \`$FINGERPRINT\`.

          Datos (c) colaboradores de OpenStreetMap, disponibles bajo ODbL 1.0.
          https://www.openstreetmap.org/copyright

          Consumidos por la app Joru. URL estable del catalogo:
          https://github.com/$REPO/releases/latest/download/catalog.json"
          # Sale del estado de borrador solo ahora, con el catalogo ya subido: hasta
          # este momento /releases/latest/download/ seguia sirviendo el anterior entero.
          gh release edit "$TAG" --draft=false --latest --notes "$notes"

      - name: Resumen
        # Deja a la vista QUE CODIGO construyo estos extractos. Un "Re-run jobs" sobre
        # una ejecucion antigua rejecuta el COMMIT ORIGINAL, no el actual: sin esto, el
        # Release sale con fecha nueva y contenido viejo y no hay forma de notarlo
        # (paso real, 2026-07-29). Para tomar el ultimo commit hay que lanzar una
        # ejecucion NUEVA con "Run workflow".
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          ATTEMPT: ${{ github.run_attempt }}
          TAG: ${{ needs.plan.outputs.tag }}
          REGIONS: ${{ needs.plan.outputs.regions }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          {
            echo "### Extractos construidos"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| release | \`$TAG\` |"
            echo "| regiones construidas | $REGIONS en $SHARDS shards |"
            echo "| regiones en el catalogo | $CATALOG_REGIONS |"
            echo "| shards | $BUILD_RESULT |"
            echo "| commit | \`${SHA:0:7}\` (\`$REF\`) |"
            echo "| intento | #$ATTEMPT |"
            echo "| huella del filtro | \`$FINGERPRINT\` |"
            echo
            if [ "$BUILD_RESULT" != "success" ]; then
              echo "> **Faltan regiones.** El catalogo hereda del Release anterior las que"
              echo "> siguen sirviendo y descarta las desfasadas. Para rellenarlas: **Run"
              echo "> workflow** con **repair** marcado y el MISMO \`scope\`, una vez este"
              echo "> Release ya publicado (repair rellena el vigente, no crea otro)."
              echo
            fi
            if [ "$ATTEMPT" != "1" ]; then
              echo "> **Aviso:** esto es un *re-run*, asi que usa el commit \`${SHA:0:7}\`,"
              echo "> NO el ultimo de la rama. Si esperabas cambios recientes, lanza una"
              echo "> ejecucion nueva con **Run workflow**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
